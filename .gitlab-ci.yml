# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD – Backend API (.NET 9) + Flutter Web App
# Builds Docker images and deploys them via SSH to a self-hosted server
# behind Traefik as reverse proxy.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#
#   SSH_PRIVATE_KEY          Private key for SSH access to the server (file / masked)
#   SERVER_HOST              IP or hostname of the server
#   SERVER_USER              SSH user on the server (e.g. deploy)
#
#   ── Backend ──────────────────────────────────────────────────────────────
#   API_DOMAIN               Public domain for the API (e.g. api.example.com)
#   CORS_ORIGINS             Allowed CORS origins (e.g. https://app.example.com)
#   OPENAI_API_KEY           OpenAI API key (masked)
#   GEMINI_API_KEY           Google Gemini API key (masked)
#   FIREBASE_PROJECT_ID      Firebase project ID
#   FIREBASE_PRIVATE_KEY_ID  Firebase private key ID
#   FIREBASE_PRIVATE_KEY     Firebase private key (masked, file type recommended)
#   FIREBASE_CLIENT_EMAIL    Firebase service account email
#   FIREBASE_CLIENT_ID       Firebase client ID
#
#   ── Flutter App ──────────────────────────────────────────────────────────
#   APP_DOMAIN               Public domain for the Flutter web app (e.g. app.example.com)
#   API_BASE_URL             Backend API URL baked into the Flutter web build
#   MAPBOX_ACCESS_TOKEN      Mapbox public token — pk.… (masked)
#   GOOGLE_PLACES_API_KEY    Google Places API key (masked)
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/backend
  CONTAINER_NAME: research-backend
  APP_DOCKER_IMAGE: $CI_REGISTRY_IMAGE/app
  APP_CONTAINER_NAME: research-app
  DOCKER_BUILDKIT: "1"

# ── BACKEND BUILD ─────────────────────────────────────────────────────────────
# Builds the multi-stage Docker image and pushes it to the GitLab Container
# Registry, tagged with both the short commit SHA and 'latest'.

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        --cache-from "$DOCKER_IMAGE:latest" \
        -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$DOCKER_IMAGE:latest" \
        packages/backend/
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/backend/**/*
        - .gitlab-ci.yml

# ── BACKEND DEPLOY ────────────────────────────────────────────────────────────
# SSHes into the server, pulls the new image and restarts the container.
# Traefik picks up the labels automatically — no Traefik restart needed.

deploy-backend:
  stage: deploy
  image: alpine:latest
  needs: [build-backend]
  environment:
    name: production/backend
    url: https://$API_DOMAIN
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_HOST" << EOF
        set -e

        echo "Logging in to GitLab registry..."
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

        echo "Pulling image $DOCKER_IMAGE:latest..."
        docker pull "$DOCKER_IMAGE:latest"

        echo "Stopping and removing old container..."
        docker stop "$CONTAINER_NAME" 2>/dev/null || true
        docker rm   "$CONTAINER_NAME" 2>/dev/null || true

        echo "Starting new container..."
        docker run -d \
          --name "$CONTAINER_NAME" \
          --restart unless-stopped \
          --network traefik \
          -e ASPNETCORE_ENVIRONMENT=Production \
          -e OpenAIAPIKey="$OPENAI_API_KEY" \
          -e GeminiAPIKey="$GEMINI_API_KEY" \
          -e CORS="$CORS_ORIGINS" \
          -e FirebaseCredentials__type=service_account \
          -e FirebaseCredentials__project_id="$FIREBASE_PROJECT_ID" \
          -e FirebaseCredentials__private_key_id="$FIREBASE_PRIVATE_KEY_ID" \
          -e "FirebaseCredentials__private_key=$FIREBASE_PRIVATE_KEY" \
          -e FirebaseCredentials__client_email="$FIREBASE_CLIENT_EMAIL" \
          -e FirebaseCredentials__client_id="$FIREBASE_CLIENT_ID" \
          -e FirebaseCredentials__token_uri=https://oauth2.googleapis.com/token \
          -e FirebaseCredentials__auth_uri=https://accounts.google.com/o/oauth2/auth \
          -e FirebaseCredentials__universe_domain=googleapis.com \
          -l "traefik.enable=true" \
          -l "traefik.http.routers.$CONTAINER_NAME.rule=Host(\`$API_DOMAIN\`)" \
          -l "traefik.http.routers.$CONTAINER_NAME.entrypoints=websecure" \
          -l "traefik.http.routers.$CONTAINER_NAME.tls=true" \
          -l "traefik.http.routers.$CONTAINER_NAME.tls.certresolver=letsencrypt" \
          -l "traefik.http.services.$CONTAINER_NAME.loadbalancer.server.port=5005" \
          "$DOCKER_IMAGE:latest"

        echo "Cleaning up unused images..."
        docker image prune -f

        echo "Backend deploy complete."
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/backend/**/*
        - .gitlab-ci.yml

# ── APP BUILD ─────────────────────────────────────────────────────────────────
# Builds the Flutter web app inside a multi-stage Docker image.
# Env vars are baked in at build time via --build-arg (flutter_dotenv embeds
# the .env file into the compiled JS bundle — no runtime injection possible).

build-app:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        --cache-from "$APP_DOCKER_IMAGE:latest" \
        --build-arg API_BASE_URL="$API_BASE_URL" \
        --build-arg MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
        --build-arg GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY" \
        -t "$APP_DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$APP_DOCKER_IMAGE:latest" \
        packages/app/
    - docker push "$APP_DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$APP_DOCKER_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/app/**/*
        - .gitlab-ci.yml

# ── APP DEPLOY ────────────────────────────────────────────────────────────────
# SSHes into the server, pulls the new image and restarts the nginx container.
# Traefik handles TLS termination and forwards HTTP to port 80 inside the container.

deploy-app:
  stage: deploy
  image: alpine:latest
  needs: [build-app]
  environment:
    name: production/app
    url: https://$APP_DOMAIN
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_HOST" << EOF
        set -e

        echo "Logging in to GitLab registry..."
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

        echo "Pulling image $APP_DOCKER_IMAGE:latest..."
        docker pull "$APP_DOCKER_IMAGE:latest"

        echo "Stopping and removing old container..."
        docker stop "$APP_CONTAINER_NAME" 2>/dev/null || true
        docker rm   "$APP_CONTAINER_NAME" 2>/dev/null || true

        echo "Starting new container..."
        docker run -d \
          --name "$APP_CONTAINER_NAME" \
          --restart unless-stopped \
          --network traefik \
          -l "traefik.enable=true" \
          -l "traefik.http.routers.$APP_CONTAINER_NAME.rule=Host(\`$APP_DOMAIN\`)" \
          -l "traefik.http.routers.$APP_CONTAINER_NAME.entrypoints=websecure" \
          -l "traefik.http.routers.$APP_CONTAINER_NAME.tls=true" \
          -l "traefik.http.routers.$APP_CONTAINER_NAME.tls.certresolver=letsencrypt" \
          -l "traefik.http.services.$APP_CONTAINER_NAME.loadbalancer.server.port=80" \
          "$APP_DOCKER_IMAGE:latest"

        echo "Cleaning up unused images..."
        docker image prune -f

        echo "App deploy complete."
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/app/**/*
        - .gitlab-ci.yml
