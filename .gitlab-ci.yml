stages:
  - build
  - deploy

variables:
  DEPLOY_PATH_APP: "/opt/sites/research-app"
  DEPLOY_PATH_BACKEND: "/opt/sites/research-backend"

# ── BUILD FLUTTER WEB ─────────────────────────────────────────────────────
build-app:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - cd packages/app
    - flutter pub get
    - |
      printf 'API_BASE_URL=%s\nMAPBOX_ACCESS_TOKEN=%s\nGOOGLE_PLACES_API_KEY=%s\n' \
        "$API_BASE_URL" "$MAPBOX_ACCESS_TOKEN" "$GOOGLE_PLACES_API_KEY" > .env
    - flutter build web --release
    - cp compose.prod.yml build/web/compose.yml
  artifacts:
    paths:
      - packages/app/build/web/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── BUILD BACKEND ─────────────────────────────────────────────────────────
build-backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd packages/backend
    - dotnet publish -c Release -o publish /p:UseAppHost=false
    - cp compose.prod.yml publish/compose.yml
  artifacts:
    paths:
      - packages/backend/publish/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── DEPLOY FLUTTER WEB ────────────────────────────────────────────────────
deploy-app:
  stage: deploy
  image: alpine:latest
  needs: [build-app]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH_APP"
    - rsync -avz --delete -e "ssh" packages/app/build/web/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH_APP/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "echo 'APP_DOMAIN=${APP_DOMAIN}' > $DEPLOY_PATH_APP/.env"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH_APP && docker compose up -d --force-recreate"
    - echo "✅ Flutter web deployed!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── DEPLOY BACKEND ────────────────────────────────────────────────────────
deploy-backend:
  stage: deploy
  image: alpine:latest
  needs: [build-backend]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH_BACKEND"
    - rsync -avz --delete -e "ssh" packages/backend/publish/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH_BACKEND/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "echo 'BACKEND_DOMAIN=${BACKEND_DOMAIN}' > $DEPLOY_PATH_BACKEND/.env"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH_BACKEND && docker compose up -d --force-recreate"
    - echo "✅ Backend deployed!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
