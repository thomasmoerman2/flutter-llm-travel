# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD – Monorepo: .NET 9 Backend + Flutter Web App
# Builds Docker images → pushes to GitLab Registry → deploys via SSH + Traefik
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend
  CONTAINER_NAME_BACKEND: research-backend

  DOCKER_IMAGE_APP: $CI_REGISTRY_IMAGE/app
  CONTAINER_NAME_APP: research-app

  DOCKER_BUILDKIT: "1"

# ── BACKEND ────────────────────────────────────────────────────────────────

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        --cache-from "$DOCKER_IMAGE_BACKEND:latest" \
        -t "$DOCKER_IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA" \
        -t "$DOCKER_IMAGE_BACKEND:latest" \
        -f packages/backend/Dockerfile \
        packages/backend/
    - docker push "$DOCKER_IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE_BACKEND:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/backend/**/*
        - .gitlab-ci.yml

deploy-backend:
  stage: deploy
  image: alpine:latest
  needs: [build-backend]
  environment:
    name: production/backend
    url: https://$API_DOMAIN
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_HOST" << 'EOF'
        set -e
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker pull "$DOCKER_IMAGE_BACKEND:latest"

        docker stop "$CONTAINER_NAME_BACKEND" 2>/dev/null || true
        docker rm "$CONTAINER_NAME_BACKEND" 2>/dev/null || true

        docker run -d \
          --name "$CONTAINER_NAME_BACKEND" \
          --restart unless-stopped \
          --network traefik \
          -e ASPNETCORE_ENVIRONMENT=Production \
          -e OpenAIAPIKey="$OPENAI_API_KEY" \
          -e GeminiAPIKey="$GEMINI_API_KEY" \
          -e CORS="$CORS_ORIGINS" \
          -e FirebaseCredentials__type=service_account \
          -e FirebaseCredentials__project_id="$FIREBASE_PROJECT_ID" \
          -e FirebaseCredentials__private_key_id="$FIREBASE_PRIVATE_KEY_ID" \
          -e "FirebaseCredentials__private_key=$FIREBASE_PRIVATE_KEY" \
          -e FirebaseCredentials__client_email="$FIREBASE_CLIENT_EMAIL" \
          -e FirebaseCredentials__client_id="$FIREBASE_CLIENT_ID" \
          -e FirebaseCredentials__token_uri=https://oauth2.googleapis.com/token \
          -e FirebaseCredentials__auth_uri=https://accounts.google.com/o/oauth2/auth \
          -e FirebaseCredentials__universe_domain=googleapis.com \
          -l "traefik.enable=true" \
          -l "traefik.http.routers.$CONTAINER_NAME_BACKEND.rule=Host(\`$API_DOMAIN\`)" \
          -l "traefik.http.routers.$CONTAINER_NAME_BACKEND.entrypoints=websecure" \
          -l "traefik.http.routers.$CONTAINER_NAME_BACKEND.tls=true" \
          -l "traefik.http.routers.$CONTAINER_NAME_BACKEND.tls.certresolver=letsencrypt" \
          -l "traefik.http.services.$CONTAINER_NAME_BACKEND.loadbalancer.server.port=5005" \
          "$DOCKER_IMAGE_BACKEND:latest"

        docker image prune -f
        echo "Backend deployed successfully."
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/backend/**/*
        - .gitlab-ci.yml

# ── FLUTTER WEB APP ───────────────────────────────────────────────────────

build-app:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        --cache-from "$DOCKER_IMAGE_APP:latest" \
        --build-arg API_BASE_URL="$API_BASE_URL" \
        --build-arg MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
        --build-arg GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY" \
        -t "$DOCKER_IMAGE_APP:$CI_COMMIT_SHORT_SHA" \
        -t "$DOCKER_IMAGE_APP:latest" \
        -f packages/app/Dockerfile \
        .
    - docker push "$DOCKER_IMAGE_APP:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE_APP:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/app/**/*
        - .gitlab-ci.yml

deploy-app:
  stage: deploy
  image: alpine:latest
  needs: [build-app]
  environment:
    name: production/app
    url: https://$APP_DOMAIN
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_HOST" << 'EOF'
        set -e
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker pull "$DOCKER_IMAGE_APP:latest"

        docker stop "$CONTAINER_NAME_APP" 2>/dev/null || true
        docker rm "$CONTAINER_NAME_APP" 2>/dev/null || true

        docker run -d \
          --name "$CONTAINER_NAME_APP" \
          --restart unless-stopped \
          --network traefik \
          -l "traefik.enable=true" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.rule=Host(\`$APP_DOMAIN\`)" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.entrypoints=websecure" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.tls=true" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.tls.certresolver=letsencrypt" \
          -l "traefik.http.services.$CONTAINER_NAME_APP.loadbalancer.server.port=80" \
          "$DOCKER_IMAGE_APP:latest"

        docker image prune -f
        echo "Flutter Web App deployed successfully."
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/app/**/*
        - .gitlab-ci.yml
