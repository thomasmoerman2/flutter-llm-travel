stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "" # ← This often fixes dind issues
  DOCKER_DRIVER: overlay2

  DOCKER_IMAGE_APP: $CI_REGISTRY_IMAGE/app
  CONTAINER_NAME_APP: research-app

# ── BUILD FLUTTER WEB ─────────────────────────────────────────────────────
build-app:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" | docker login \
        --username "$CI_REGISTRY_USER" \
        --password-stdin \
        "$CI_REGISTRY"
  script:
    - |
      docker build \
        --cache-from "$DOCKER_IMAGE_APP:latest" \
        --build-arg API_BASE_URL="$API_BASE_URL" \
        --build-arg MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
        --build-arg GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY" \
        -t "$DOCKER_IMAGE_APP:$CI_COMMIT_SHORT_SHA" \
        -t "$DOCKER_IMAGE_APP:latest" \
        -f packages/app/Dockerfile \
        .
    - docker push "$DOCKER_IMAGE_APP:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE_APP:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── DEPLOY FLUTTER WEB ────────────────────────────────────────────────────
deploy-app:
  stage: deploy
  image: alpine:latest
  needs: [build-app]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
        set -e
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          --username "$CI_REGISTRY_USER" \
          --password-stdin \
          "$CI_REGISTRY"

        docker pull "$DOCKER_IMAGE_APP:latest"

        docker stop "$CONTAINER_NAME_APP" 2>/dev/null || true
        docker rm "$CONTAINER_NAME_APP" 2>/dev/null || true

        docker run -d \
          --name "$CONTAINER_NAME_APP" \
          --restart unless-stopped \
          --network traefik \
          -l "traefik.enable=true" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.rule=Host(\`$APP_DOMAIN\`)" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.entrypoints=websecure" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.tls=true" \
          -l "traefik.http.routers.$CONTAINER_NAME_APP.tls.certresolver=letsencrypt" \
          -l "traefik.http.services.$CONTAINER_NAME_APP.loadbalancer.server.port=80" \
          "$DOCKER_IMAGE_APP:latest"

        docker image prune -f
        echo "✅ Flutter Web App deployed!"
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
