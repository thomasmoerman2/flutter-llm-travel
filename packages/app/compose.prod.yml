services:
  app:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.research-app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.research-app.entrypoints=websecure"
      - "traefik.http.routers.research-app.tls=true"
      - "traefik.http.routers.research-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.research-app.loadbalancer.server.port=8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
