name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.3
  lucide_icons_flutter: ^3.1.9
  easy_localization: ^3.0.7
  flutter_dotenv: ^6.0.0
  mapbox_maps_flutter: ^2.0.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/i18n/
    - assets/fonts/
    - assets/images/
    - assets/data/
    - .env
